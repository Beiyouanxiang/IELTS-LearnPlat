# 雅思学习工作台 Nginx 配置
#
# 注意：服务器上 80 端口已被 Bookmark-Page 占用（server_name 有可能是 IP 或 _）。
# 若再写一个 listen 80 且 server_name 相同，会与已有 server 块冲突。
# 因此这里默认监听 8080，走独立端口最省事、零风险。
# 域名备案后，改成独立子域名（如 ielts.transistorsandtokens.com）再配 certbot 上 443。
#
# 部署：放到 /etc/nginx/sites-available/ielts 并软链到 sites-enabled，然后 nginx -t && systemctl reload nginx

server {
    listen 8080;
    server_name _;

    # 音频上传最大 50MB，留点余量
    client_max_body_size 60m;

    # 安全响应头（应用层也会设置，这里再兜一层）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传音频 / LLM 调用可能较慢
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
    }
}
