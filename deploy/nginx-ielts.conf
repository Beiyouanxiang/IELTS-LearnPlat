# 雅思学习工作台 Nginx 配置（公网入口）
#
# 架构：Node 只监听回环 127.0.0.1:3007，Nginx 是唯一公网入口。
#
# 部署：
#   sudo cp /etc/nginx/sites-available/ielts /etc/nginx/backups/ielts.bak.$(date +%Y%m%d-%H%M%S)
#   sudo cp <本文件> /etc/nginx/sites-available/ielts
#   sudo ln -sf /etc/nginx/sites-available/ielts /etc/nginx/sites-enabled/ielts
#   sudo nginx -t && sudo systemctl reload nginx
#
# 拿到 HTTPS（DNS 解析加好之后）：
#   sudo certbot --nginx -d ielts.transistorsandtokens.com
#
# ---------------------------------------------------------------------------
# 【重要】阿里云会按 Host / SNI 拦截未备案域名
#
# 实测：访问未备案域名会拿到 403，响应头 `Server: Beaver`，页面标题
# `Non-compliance ICP Filing`，并跳转 aliyun.com/beian/beian-block。
# 这不是 nginx 或应用的配置问题。
#
# 由此推断出的结论（都实测过）：
#   1) *.sslip.io 这类"公共泛解析、免配 DNS"的临时域名方案在本机**完全不可用**
#      —— ielts.120.25.150.103.sslip.io / bookmarks.120.25.150.103.sslip.io 全是 403。
#   2) 只有**已备案**的 *.transistorsandtokens.com 能过（exam199. / bookmarks. 实测 200）。
#   3) 纯 IP 访问（Host 是 IP）不受备案拦截。
#
# 所以正式入口只能是 ielts.transistorsandtokens.com：在阿里云「云解析」加一条
# A 记录 ielts -> 120.25.150.103 即可（父域名已备案，子域无需单独备案）。
#
# 解析就绪前，可以先用子路径过渡入口 http://120.25.150.103/ielts/
# （挂在 sites-enabled/bookmark 的 80 块里，前端需 VITE_BASE=/ielts/ 构建，
#  详见项目 README「子路径部署」一节）。
# ---------------------------------------------------------------------------
#
# 【坑】add_header 不继承：只要在 location 里写了任何一个 add_header，
#      server 级的安全头对该 location 会全部失效。所以 location 内只放业务指令。

server {
    listen 80;
    listen [::]:80;
    server_name ielts.transistorsandtokens.com;

    server_tokens off;
    # 听力音频上传：应用侧限 50MB，这里留余量
    client_max_body_size 60m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 音频上传 / LLM 批改可能较慢
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
