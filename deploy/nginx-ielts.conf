# 雅思学习工作台 Nginx 配置（公网入口）
#
# 架构：Node 只监听 127.0.0.1:3007，Nginx 是唯一公网入口。
#
# 域名策略（与本服务器其它应用一致：每个应用一个独立子域 + HTTPS）
#   首选  https://ielts.transistorsandtokens.com
#         需在阿里云「云解析」加一条 A 记录 ielts -> 120.25.150.103，
#         然后 certbot --nginx -d ielts.transistorsandtokens.com
#   过渡  https://ielts.120.25.150.103.sslip.io
#         sslip.io 是公共泛解析服务，<任意前缀>.<IP>.sslip.io 自动解析到该 IP，
#         无需任何 DNS 配置即可拿到证书。本机 bookmarks / iching / maoxuan 已在用这套。
#         缺点是对用户不友好，仅作为解析未就绪时的过渡入口。
#
# 部署：
#   sudo cp /etc/nginx/sites-available/ielts /etc/nginx/sites-available/ielts.bak.$(date +%Y%m%d-%H%M%S)
#   sudo cp <本文件> /etc/nginx/sites-available/ielts
#   sudo ln -sf /etc/nginx/sites-available/ielts /etc/nginx/sites-enabled/ielts
#   sudo nginx -t && sudo systemctl reload nginx
#
# 【坑】add_header 不继承：只要在 location 里写了任何一个 add_header，
#      server 级的安全头对该 location 会全部失效。所以 location 内只放业务指令。

server {
    listen 80;
    listen [::]:80;
    server_name ielts.120.25.150.103.sslip.io;

    server_tokens off;
    # 听力音频上传：应用侧限 50MB，这里留余量
    client_max_body_size 60m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 音频上传 / LLM 批改可能较慢
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
